# This workflow is called from:
# o) build workflows, eg cyberdojo/saver/.github/workflows/main.yml.
# o) deployment workflows, from the cyberdojo/aws-prod-co-promotion repo
# o) this repos workflow to scan aws-beta and aws-prod Environments
#
# Relies on the caller's context having:
# ${{env.KOSLI_ORG}}
# ${{env.KOSLI_HOST}}

name: 📦 Artifact Snyk Test

on:
  workflow_call:
    outputs:
      vulns_json:
        description: "JSON array of vuln objects for the artifact"
        value: ${{jobs.attest-snyk-vulns.outputs.vulns}}

    secrets:
      snyk_token:
        required: true
      kosli_api_token:
        required: true

    inputs:
      artifact_name:
        description: "Artifact name"
        required: true
        type: string

      aws_rolename:
        description: "Rolename to configure artifact download credentials"
        required: false
        type: string
        default: gh_actions_services

      kosli_flow:
        description: "The Kosli flow to attest to"
        required: true
        type: string

      kosli_trail:
        description: "The Kosli trail to attest to"
        required: false
        type: string
        default: ${{github.sha}}

      kosli_attestation_name:
        description: "The Kosli attestation name"
        required: true
        type: string

      attest_to_kosli:
        description: "Whether to make the attestation"
        required: false
        type: boolean
        default: ${{github.ref == 'refs/heads/main'}}

      kosli_env:
        description: "The name of the environment the artifact is in or will be deployed to"
        required: false
        type: string
        default: aws-beta

      repo_name:
        description: "Repo the artifact was built in"
        required: false
        type: string
        default: ${{github.event.repository.name}}

      snyk_version:
        description: "Version of snyk to run"
        required: false
        type: string
        default: v1.1300.2

      raw_snyk_policy_url:
        description: "URL of snyk policy file (in commit for artifact)"
        required: false
        type: string
        default: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.snyk

env:
  KOSLI_DEBUG:     ${{vars.KOSLI_DEBUG}}   # false
  KOSLI_DRY_RUN:   ${{vars.KOSLI_DRY_RUN}} # false
  KOSLI_HOST:      ${{vars.KOSLI_HOST}}    # https://app.kosli.com
  KOSLI_ORG:       ${{vars.KOSLI_ORG}}     # cyber-dojo
  KOSLI_FLOW:      ${{inputs.kosli_flow}}
  KOSLI_TRAIL:     ${{inputs.kosli_trail}}
  KOSLI_API_TOKEN: ${{secrets.kosli_api_token}}

  SNYK_CAT_NAME:        single-snyk-vuln

  # Every path below is outside the caller's checkout. The jobs that run
  # against the caller's context checkout the caller's repo, so a file written
  # relative to the working directory would land in that tree, where a
  # same-named file of its own would be silently overwritten.
  #
  # The prefix says where the file came from:
  #   SNYK_SCANNING_  unpacked from this repo, at one pinned commit
  #   CALLER_         fetched from the repo being scanned
  #   TMP_            produced by this run
  #
  # The two bare names survive because they are also needed unqualified:
  # find-snyk-vulns works in its own checkout, and an upload/download artifact
  # name cannot contain a '/'.
  SNYK_POLICY_FILENAME: .snyk
  SNYK_SARIF_FILENAME:  snyk.container.test.json

  CALLER_SNYK_POLICY_FILE: /tmp/.snyk
  TMP_SNYK_SARIF_FILE:     /tmp/snyk.container.test.json

  SNYK_SCANNING_DIR:               /tmp/snyk-scanning
  SNYK_SCANNING_REGO_POLICY_FILE:  /tmp/snyk-scanning/snyk-vuln-compliance.rego
  SNYK_SCANNING_REGO_PARAMS_FILE:  /tmp/snyk-scanning/rego.params.${{inputs.kosli_env}}.json
  SNYK_SCANNING_ANNOTATIONS_FILE:  /tmp/snyk-scanning/bin/vuln_annotations.py
  SNYK_SCANNING_STAMP_TIMES_FILE:  /tmp/snyk-scanning/bin/stamp_vuln_times.py
  SNYK_SCANNING_SCAN_SUMMARY_FILE: /tmp/snyk-scanning/bin/print_artifact_scan_summary.py

jobs:
  find-snyk-vulns:
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{steps.set-fingerprint.outputs.fingerprint}}
      vulns: ${{steps.set-vulns.outputs.vulns}}
      scanning_sha: ${{steps.set-scanning-sha.outputs.sha}}
    permissions:
      id-token: write
      contents: read
    env:
      VULNS_FILENAME: vulns.json
      STALE_VULNS_FILENAME: stale_vulns.json
    steps:
      - uses: cyber-dojo/harden-runner@main
      - uses: cyber-dojo/setup-kosli-cli@main

      - uses: actions/checkout@v6
        with:
          repository: cyber-dojo/snyk-scanning
          ref: main
          fetch-depth: 1

      # The later jobs unpack this same commit, so one run reads one version
      # of the scripts and policy files rather than whatever main holds when
      # each job happens to reach for them.
      - name: Pin the version of snyk-scanning this run uses
        id: set-scanning-sha
        run:
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials
        if: contains(inputs.artifact_name, '.amazonaws.com')
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::244531986313:role/${{inputs.aws_rolename}}
          aws-region: eu-central-1
          role-duration-seconds: 2400
          role-session-name: ${{github.event.repository.name}}

      - name: Login to Amazon ECR
        if: contains(inputs.artifact_name, '.amazonaws.com')
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create custom-attestation-type
        run:
          kosli create attestation-type ${SNYK_CAT_NAME}
            --schema single-snyk-vuln.schema.json
            --jq 'true'

      - name: Set output fingerprint
        id: set-fingerprint
        run: |
          # Strip the digest if present
          # kosli-fingerprint does not yet support tag+digest

          ARTIFACT="${{inputs.artifact_name}}"
          ARTIFACT="${ARTIFACT%%@sha256:*}"

          FINGERPRINT="$(kosli fingerprint "${ARTIFACT}" \
            --artifact-type=oci \
            --debug=false \
          )"
          echo "fingerprint=${FINGERPRINT}" >> ${GITHUB_OUTPUT}

      - name: Setup Snyk
        uses: snyk/actions/setup@master
        with:
          snyk-version: ${{inputs.snyk_version}}

      - name: Fail if the sarif file already exists
        run: |
          if test -f ${SNYK_SARIF_FILENAME} ; then
            echo "ERROR: ${SNYK_SARIF_FILENAME} already exists"
            exit 42
          fi

      - name: Create empty .snyk policy file
        run:
          echo > ${SNYK_POLICY_FILENAME}

      - name: Run Snyk container test with empty .snyk policy file
        env:
          SNYK_TOKEN: ${{secrets.snyk_token}}
        run:
          snyk container test ${{inputs.artifact_name}}
            --policy-path=${SNYK_POLICY_FILENAME}
            --sarif
            --sarif-file-output=${SNYK_SARIF_FILENAME} || true

      - name: Fail if the sarif file is not created
        run: |
          # Guard against 0 exit code but no sarif file created!
          if ! test -f ${SNYK_SARIF_FILENAME} ; then
            echo "ERROR: ${SNYK_SARIF_FILENAME} was not created"
            exit 43
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{inputs.repo_name}}-${{env.SNYK_SARIF_FILENAME}}
          path: ${{env.SNYK_SARIF_FILENAME}}

      - name: Get the real .snyk file
        uses: ./.github/actions/fetch-url-to-file
        with:
          url: ${{inputs.raw_snyk_policy_url}}
          path: ${{env.SNYK_POLICY_FILENAME}}
          optional: 'true'

      - name: Debug print policy file
        if: env.KOSLI_DEBUG == 'true'
        run:
          cat "${SNYK_POLICY_FILENAME}"

      - name: Combine all data ready for individual data attestations
        run: |
          ./bin/combine_snyk.py \
            ${{inputs.snyk_version}} \
            ${{inputs.repo_name}} \
            ${SNYK_SARIF_FILENAME} \
            ${SNYK_POLICY_FILENAME} \
            ${STALE_VULNS_FILENAME} \
            "${{inputs.artifact_name}}" \
            "${{steps.set-fingerprint.outputs.fingerprint}}" \
              > ${VULNS_FILENAME}

      - name: Write stale .snyk entries to job summary
        run: |
          ./bin/print_stale_snyk_entries_summary.py "${STALE_VULNS_FILENAME}" \
            --artifact-name "${{inputs.artifact_name}}" \
            --fingerprint   "${{steps.set-fingerprint.outputs.fingerprint}}" \
            --snyk-version  "${{inputs.snyk_version}}" \
            >> $GITHUB_STEP_SUMMARY

      - name: Debug print vulns
        if: env.KOSLI_DEBUG == 'true'
        run:
          jq . "${VULNS_FILENAME}"

      - name: Set output vulns
        id: set-vulns
        run: |
          VULNS="$(jq --compact-output . ${VULNS_FILENAME})"
          echo "vulns=${VULNS}" >> ${GITHUB_OUTPUT}


  attest-individual-snyk-vulns:
    needs: [find-snyk-vulns]
    if: needs.find-snyk-vulns.outputs.vulns != '[]'
    runs-on: ubuntu-latest
    env:
      VULN_JSON: ${{toJSON(matrix)}}
      # Bare, because an upload-artifact name cannot contain a '/'
      VULN_FILENAME: vuln-${{matrix.trail_name}}.json
      TMP_VULN_FILE: /tmp/vuln-${{matrix.trail_name}}.json
      TMP_TRAIL_FILE: /tmp/trail.json
      TMP_VULN_REWRITE_FILE: /tmp/vuln-rewrite-${{matrix.trail_name}}.json
      KOSLI_FLOW: snyk-${{inputs.kosli_env}}-per-vuln
      KOSLI_TRAIL: ${{matrix.trail_name}}
    strategy:
      matrix:
        include: ${{fromJSON(needs.find-snyk-vulns.outputs.vulns)}}
    steps:
      - uses: cyber-dojo/harden-runner@main
      - uses: cyber-dojo/pinned-checkout@main
      - uses: cyber-dojo/setup-kosli-cli@main

      - name: Set the per-vuln attestation name
        run: |
          FINGERPRINT="${{matrix.artifact_fingerprint}}"
          echo "VULN_ATTESTATION_NAME=snyk-${FINGERPRINT:0:10}" >> "${GITHUB_ENV}"

      # The checkout is in the caller's context, so the action is named by its
      # repo path rather than ./.github/actions/
      - name: Get this workflow's scripts and policy files
        uses: cyber-dojo/snyk-scanning/.github/actions/fetch-snyk-scanning-tarball@main
        with:
          ref: ${{needs.find-snyk-vulns.outputs.scanning_sha}}
          dir: ${{env.SNYK_SCANNING_DIR}}

      - name: Add times the vuln was first seen and is being measured at
        run: |
          kosli create flow ${KOSLI_FLOW} \
            --description "Individual Snyk vuln trails for ${{inputs.kosli_env}} artifacts" \
            --use-empty-template

          WORKFLOW_URL="https://github.com/cyber-dojo/snyk-scanning/blob/main/.github/workflows/artifact_snyk_test.yml"
          kosli tag flow ${KOSLI_FLOW} \
            --set env=${{inputs.kosli_env}} \
            --set kind=run \
            --set ci=github \
            --set workflow_url="${WORKFLOW_URL}"

          kosli begin trail ${KOSLI_TRAIL}
          kosli get trail ${KOSLI_TRAIL} --debug=false --output=json > "${TMP_TRAIL_FILE}"

          # Stamped here, after the trail exists, so that the instant a vuln's
          # age is measured at is never earlier than the trail created_at it is
          # measured against. Each vuln in the matrix gets its own stamp, which
          # keeps every vuln self-consistent.
          python3 "${SNYK_SCANNING_STAMP_TIMES_FILE}" \
            "${TMP_TRAIL_FILE}" \
            "${VULN_JSON}" > "${TMP_VULN_FILE}"

      - name: Debug print one vuln
        if: env.KOSLI_DEBUG == 'true'
        run:
          jq . "${TMP_VULN_FILE}"

      - name: Make snyk-vuln data attestation to Kosli
        run:
          kosli attest custom
            --annotate snyk_URL=${{matrix.vuln_url}}
            --attestation-data "${TMP_VULN_FILE}"
            --name ${VULN_ATTESTATION_NAME}
            --type ${SNYK_CAT_NAME}

      - name: Get attestation URL ready for --annotate
        run: |
          ATTESTATION_URL="$(kosli get attestation ${VULN_ATTESTATION_NAME} \
            --flow ${KOSLI_FLOW} \
            --trail ${KOSLI_TRAIL} \
            --output json \
            --debug=false \
            | jq -r 'first | .html_url')"

          jq --arg url "${ATTESTATION_URL}" \
            '. + {"attestation_url": $url}' \
            "${TMP_VULN_FILE}" > "${TMP_VULN_REWRITE_FILE}" \
            && mv "${TMP_VULN_REWRITE_FILE}" "${TMP_VULN_FILE}"

      # upload-artifact produces an "Artifacts produced during runtime" section
      # in the GitHub step summary. We would like to avoid this because the
      # upload/download is an implementation detail, not something the user
      # needs to see. Switching to actions/cache would remove it, but there
      # is no glob-restore equivalent: each entry must be restored by its exact
      # key. The workaround is to use the GitHub cache REST API directly in a
      # shell step -- save with POST /caches in the matrix job and restore with
      # GET /caches?key=vuln- in the final job -- but this is considerably more
      # complex. Leaving as-is for now since for cyber-dojo at least, a lot of 
      # the time artifacts will have no vulns (except for creator and runner).
      - uses: actions/upload-artifact@v7
        with:
          name: ${{env.VULN_FILENAME}}
          path: ${{env.TMP_VULN_FILE}}


  attest-snyk-vulns:
    needs: [find-snyk-vulns, attest-individual-snyk-vulns]
    if: always() && inputs.attest_to_kosli && needs.find-snyk-vulns.result == 'success'
    outputs:
      vulns: ${{steps.set-vulns.outputs.vulns}}
    runs-on: ubuntu-latest
    env:
      TMP_VULNS_FILE: /tmp/vulns.json
      TMP_POLICY_INPUT_FILE: /tmp/policy_input.json
      TMP_EVALUATION_FILE: /tmp/evaluation.json
      TMP_ANNOTATIONS_TXT: /tmp/annotations.txt
      TMP_ATTESTATION_FILE: /tmp/attestation.json
      KOSLI_FINGERPRINT: ${{needs.find-snyk-vulns.outputs.fingerprint}}
      KOSLI_ATTESTATION_NAME: ${{inputs.kosli_attestation_name}}
    steps:
      - uses: cyber-dojo/harden-runner@main
      - uses: cyber-dojo/pinned-checkout@main
      - uses: cyber-dojo/setup-kosli-cli@main

      - uses: actions/download-artifact@v8
        with:
          pattern: vuln-${{inputs.repo_name}}-*.json
          merge-multiple: true
          path: /tmp

      - uses: actions/download-artifact@v8
        with:
          name: ${{inputs.repo_name}}-${{env.SNYK_SARIF_FILENAME}}
          path: /tmp

      - name: Set vuln output
        run: |
          if [ "${{needs.attest-individual-snyk-vulns.result}}" = "skipped" ]; then
            VULNS=[]
          else
            VULNS="$(jq --compact-output --slurp . /tmp/vuln-*.json)"
          fi
          echo "${VULNS}" > "${TMP_VULNS_FILE}"

      - name: Debug print vulns
        if: env.KOSLI_DEBUG == 'true'
        run:
          jq . "${TMP_VULNS_FILE}"

      # The checkout is in the caller's context, so both actions are named by
      # their repo path rather than ./.github/actions/
      - name: Get the real .snyk file from the repo being scanned
        uses: cyber-dojo/snyk-scanning/.github/actions/fetch-url-to-file@main
        with:
          url: ${{inputs.raw_snyk_policy_url}}
          path: ${{env.CALLER_SNYK_POLICY_FILE}}
          optional: 'true'

      - name: Get this workflow's scripts and policy files
        uses: cyber-dojo/snyk-scanning/.github/actions/fetch-snyk-scanning-tarball@main
        with:
          ref: ${{needs.find-snyk-vulns.outputs.scanning_sha}}
          dir: ${{env.SNYK_SCANNING_DIR}}

      - name: Don't (re)attest the artifact in a build workflow
        if: github.repository == 'cyber-dojo/snyk-scanning' || github.repository == 'cyber-dojo/aws-prod-co-promotion'
        run: |
          # runner.snyk-scan => runner
          ARTIFACT_SLOT_NAME="${KOSLI_ATTESTATION_NAME%%.*}"

          kosli attest artifact ${{inputs.artifact_name}} \
            --name="${ARTIFACT_SLOT_NAME}"

      - name: Judge every vuln of the artifact in one evaluation
        run: |
          jq '{vulns: .}' "${TMP_VULNS_FILE}" > "${TMP_POLICY_INPUT_FILE}"

          kosli evaluate input \
            --input-file "${TMP_POLICY_INPUT_FILE}" \
            --policy "${SNYK_SCANNING_REGO_POLICY_FILE}" \
            --params "@${SNYK_SCANNING_REGO_PARAMS_FILE}" \
            --debug=false \
            --no-assert \
            --output=json > "${TMP_EVALUATION_FILE}"

      - name: Debug print evaluation
        if: env.KOSLI_DEBUG == 'true'
        run:
          jq . "${TMP_EVALUATION_FILE}"

      - name: Attest the decision, annotated pass or fail per vuln
        run: |
          COMPLIANT="$(jq '.allow' "${TMP_EVALUATION_FILE}")"
          echo "COMPLIANT=${COMPLIANT}" >> "${GITHUB_ENV}"

          # One annotation per vuln, each naming its status and pointing at that
          # vuln's own attestation. The script exits non-zero, and so fails this
          # step, rather than label a vuln whose verdict it cannot place.
          python3 "${SNYK_SCANNING_ANNOTATIONS_FILE}" \
            "${TMP_VULNS_FILE}" \
            "${TMP_EVALUATION_FILE}" > "${TMP_ANNOTATIONS_TXT}"

          ANNOTATE_FLAGS=()
          while IFS= read -r annotation; do
            ANNOTATE_FLAGS+=(--annotate "${annotation}")
          done < "${TMP_ANNOTATIONS_TXT}"

          kosli attest decision \
            --compliant "${COMPLIANT}" \
            --control "SDLC-CTRL-0022" \
            --attachments "${SNYK_SCANNING_REGO_POLICY_FILE}" \
            --attachments "${SNYK_SCANNING_REGO_PARAMS_FILE}" \
            --attachments "${TMP_SNYK_SARIF_FILE}"  \
            --attachments "${CALLER_SNYK_POLICY_FILE}" \
            --attachments "${TMP_POLICY_INPUT_FILE}" \
            --attachments "${TMP_EVALUATION_FILE}" \
            --name "${KOSLI_ATTESTATION_NAME}" \
            "${ANNOTATE_FLAGS[@]}"

      - name: Write job summary (header)
        run: |
          # We are doing a get attestation with FLOW+FINGERPRINT
          unset KOSLI_TRAIL

          # runner.snyk-scan ==> snyk-scan
          ATTESTATION_SLOT_NAME="${KOSLI_ATTESTATION_NAME#*.}"

          kosli get attestation "${ATTESTATION_SLOT_NAME}" \
            --output json \
            --debug=false \
            > "${TMP_ATTESTATION_FILE}"

          python3 "${SNYK_SCANNING_SCAN_SUMMARY_FILE}" \
            "${TMP_VULNS_FILE}" \
            "${TMP_ATTESTATION_FILE}" \
            --compliant     "${COMPLIANT}" \
            --repo-name     "${{inputs.repo_name}}" \
            --artifact-name "${{inputs.artifact_name}}" \
            --fingerprint   "${KOSLI_FINGERPRINT}" \
            --snyk-version  "${{inputs.snyk_version}}" \
            >> $GITHUB_STEP_SUMMARY

      - name: Set output vulns
        id: set-vulns
        run:
          echo "vulns=$(jq --compact-output . "${TMP_VULNS_FILE}")" >> ${GITHUB_OUTPUT}
